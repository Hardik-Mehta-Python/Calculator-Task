<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div id="calculator">
    <div id="field">
        <input type="text" id="display" readonly>

    </div>
    <div id="buttons">
        <div class="box-op" id="ac">AC</div>
        <div class="box-op" id="c">C</div>
        <div class="box-op" id="box-3" onclick="appendValue('%')">%</div>
        <div class="box-op" id="box-4" onclick="appendValue('/')">÷</div>
        <div class="box" id="box-5" onclick="appendValue('7')">7</div>
        <div class="box" id="box-6" onclick="appendValue('8')">8</div>
        <div class="box" id="box-7" onclick="appendValue('9')">9</div>
        <div class="box-op" id="box-8" onclick="appendValue('*')">x</div>
        <div class="box" id="box-9" onclick="appendValue('4')">4</div>
        <div class="box" id="box-10" onclick="appendValue('5')">5</div>
        <div class="box" id="box-11" onclick="appendValue('6')">6</div>
        <div class="box-op" id="box-12" onclick="appendValue('-')">-</div>
        <div class="box" id="box-13" onclick="appendValue('1')">1</div>
        <div class="box" id="box-14" onclick="appendValue('2')">2</div>
        <div class="box" id="box-15" onclick="appendValue('3')">3</div>
        <div class="box-op" id="box-16" onclick="appendValue('+')">+</div>
        <div class="box" id="box-17" onclick="appendValue('0')">0</div>
        <div class="box" id="box-18" onclick="appendValue('.')">.</div>
        <div class="box" id="box-19">+/-</div>
        <div class="box-op" id="output">=</div>
    </div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
